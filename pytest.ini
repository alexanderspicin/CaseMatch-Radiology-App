[pytest]
# Минимальная версия pytest
minversion = 7.0

# Пути для поиска тестов
testpaths = tests

# Паттерны файлов для тестов
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Опции по умолчанию
addopts =
    # Подробный вывод
    -v
    # Показывать локальные переменные в traceback
    -l
    # Показывать summary
    -ra
    # Строгие маркеры
    --strict-markers
    # Предупреждения как ошибки (опционально)
    # --strict-config
    # Coverage (если установлен pytest-cov)
    --cov=src
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=70
    # Параллельное выполнение (если установлен pytest-xdist)
    -n auto
    # Повторить failed тесты
    --maxfail=5

# Маркеры
markers =
    integration: mark test as integration test (may be slow)
    slow: mark test as slow running
    qdrant: mark test as requiring Qdrant database
    unit: mark test as unit test
    api: mark test as API test
    db: mark test as database test
    ml: mark test as ML model test

# Фильтры предупреждений
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Логирование
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = tests/logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Timeout для тестов (требует pytest-timeout)
timeout = 300
timeout_method = thread

# Настройки coverage
[coverage:run]
source = src
omit =
    */tests/*
    */migrations/*
    */__pycache__/*
    */venv/*
    */env/*

[coverage:report]
precision = 2
show_missing = true
skip_covered = false

exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

[coverage:html]
directory = htmlcov